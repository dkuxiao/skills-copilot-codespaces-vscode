<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数当てゲーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎯 数当てゲーム</h1>
    <p>1〜100の数字を当ててみよう！</p>

    <div class="input-area">
      <input
        type="number"
        id="guessInput"
        min="1"
        max="100"
        placeholder="数字を入力"
      />
      <button id="guessBtn">予想する</button>
    </div>

    <p id="message"></p>
    <p id="attempts"></p>

    <button id="resetBtn" class="hidden">もう一度遊ぶ</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
