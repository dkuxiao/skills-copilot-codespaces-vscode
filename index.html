<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Puzzle Game</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08), transparent 35%), radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.1), transparent 45%), var(--bg);
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      padding: 24px;
    }
    .panel {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 20px 20px 16px;
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span {
      display: inline-flex;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      align-items: center;
      justify-content: center;
      color: #0b1224;
      font-weight: 700;
      box-shadow: 0 6px 15px rgba(56, 189, 248, 0.35);
    }
    p {
      margin: 10px 0 16px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .tile {
      position: relative;
      border: none;
      border-radius: 12px;
      height: 96px;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      background: linear-gradient(145deg, #1f2937, #0f172a);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 10px 20px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.2s ease, background 0.3s ease;
    }
    .tile:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.45); }
    .tile:active { transform: translateY(1px); }
    .tile.empty {
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
      cursor: default;
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .status {
      color: var(--accent);
      font-weight: 600;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    button.control {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      color: #0b1224;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
      transition: transform 0.08s ease, box-shadow 0.2s ease;
    }
    button.control:hover { transform: translateY(-2px); }
    button.control:active { transform: translateY(1px); }
    @media (max-width: 480px) {
      .tile { height: 80px; font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1><span>9</span> Sliding Puzzle</h1>
    <p>Arrange the tiles into order. Tap a number next to the empty slot to slide it. Shuffle until you get a solvable mix, then see how few moves you need.</p>
    <div class="grid" id="grid" aria-label="Puzzle grid"></div>
    <div class="meta">
      <div>Moves: <strong id="moves">0</strong></div>
      <div class="status" id="status">Keep going...</div>
    </div>
    <div class="actions">
      <button class="control" id="shuffle">Shuffle</button>
      <button class="control" id="reset">Reset</button>
    </div>
  </main>
  <script>
    const size = 3;
    const gridEl = document.getElementById("grid");
    const movesEl = document.getElementById("moves");
    const statusEl = document.getElementById("status");
    const shuffleBtn = document.getElementById("shuffle");
    const resetBtn = document.getElementById("reset");

    let tiles = [];
    let moves = 0;

    const solved = () => {
      for (let i = 0; i < size * size - 1; i += 1) {
        if (tiles[i] !== i + 1) return false;
      }
      return tiles[tiles.length - 1] === null;
    };

    const inversionCount = (arr) => {
      const nums = arr.filter((v) => v !== null);
      let count = 0;
      for (let i = 0; i < nums.length; i += 1) {
        for (let j = i + 1; j < nums.length; j += 1) {
          if (nums[i] > nums[j]) count += 1;
        }
      }
      return count;
    };

    const isSolvable = (arr) => inversionCount(arr) % 2 === 0;

    const shuffleTiles = () => {
      const base = [...Array(size * size - 1).keys()].map((n) => n + 1).concat([null]);
      let candidate = [...base];
      do {
        candidate = [...base].sort(() => Math.random() - 0.5);
      } while (!isSolvable(candidate) || candidate.every((v, i) => v === base[i]));
      tiles = candidate;
      moves = 0;
      statusEl.textContent = "Keep going...";
      render();
    };

    const swap = (a, b) => {
      const next = [...tiles];
      const temp = next[a];
      next[a] = next[b];
      next[b] = temp;
      tiles = next;
    };

    const tryMove = (index) => {
      const empty = tiles.indexOf(null);
      const row = Math.floor(index / size);
      const col = index % size;
      const emptyRow = Math.floor(empty / size);
      const emptyCol = empty % size;
      const adjacent = (row === emptyRow && Math.abs(col - emptyCol) === 1) || (col === emptyCol && Math.abs(row - emptyRow) === 1);
      if (!adjacent) return;
      swap(index, empty);
      moves += 1;
      movesEl.textContent = moves;
      statusEl.textContent = solved() ? "Solved!" : "Keep going...";
      render();
    };

    const render = () => {
      gridEl.innerHTML = "";
      tiles.forEach((value, index) => {
        const tile = document.createElement("button");
        tile.className = value ? "tile" : "tile empty";
        tile.textContent = value ?? "";
        tile.type = "button";
        tile.onclick = () => tryMove(index);
        tile.setAttribute("aria-label", value ? `Tile ${value}` : "Empty slot");
        gridEl.appendChild(tile);
      });
    };

    const reset = () => {
      tiles = [...Array(size * size - 1).keys()].map((n) => n + 1).concat([null]);
      moves = 0;
      movesEl.textContent = moves;
      statusEl.textContent = "Keep going...";
      render();
    };

    shuffleBtn.onclick = shuffleTiles;
    resetBtn.onclick = reset;

    reset();
    shuffleTiles();
  </script>
</body>
</html>
